name: Sync Upstream

on:
  schedule:
    - cron: '0 0 */5 * *'  # 每 5 天跑一次（UTC 午夜）
  workflow_dispatch:     # 也可以手动点一次

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST /repos/luolan897/my-moontv/merge-upstream -f branch=main
